<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Hymn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="shared.css">
    <style>
        .hymn-section { background: var(--cream); }
        .hymn-card {
            background: var(--white);
            border-radius: 20px;
            padding: 3rem;
            border: 1px solid var(--cream-dark);
            max-width: 760px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        .hymn-card-gold-line {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, var(--gold), transparent);
        }
        .hymn-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .hymn-credit {
            text-align: center;
            font-size: 0.85rem;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 0.04em;
            margin-bottom: 2.5rem;
        }
        .hymn-lyrics {
            font-size: 1.02rem;
            line-height: 2;
            color: var(--gray-text);
            font-weight: 300;
            white-space: pre-line;
            text-align: center;
        }
        .hymn-audio {
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--cream-dark);
            text-align: center;
        }
        .hymn-audio audio {
            width: 100%;
            max-width: 460px;
        }
        .hymn-video {
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--cream-dark);
        }
        .hymn-video-facade {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            background: var(--navy);
        }
        .hymn-video-facade img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .hymn-video-play {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 68px; height: 68px;
            background: rgba(201,146,42,0.92);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }
        .hymn-video-facade:hover .hymn-video-play { background: var(--gold-light); transform: translate(-50%, -50%) scale(1.08); }
        .hymn-video-play::after {
            content: '';
            border-style: solid;
            border-width: 12px 0 12px 20px;
            border-color: transparent transparent transparent var(--navy);
            margin-left: 5px;
        }
        .hymn-video iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 14px;
            border: none;
            display: block;
        }
        @media (max-width: 600px) {
            .hymn-card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body data-page="hymn">

    <div id="nav-placeholder"></div>

    <div class="page-banner">
        <div class="page-banner-inner">
            <p class="page-banner-crumb"><a href="index.html">Home</a> / <a href="about-us.html">About Us</a> / School Hymn</p>
            <h1>School Hymn</h1>
            <p>The song that carries our school's heart and mission.</p>
        </div>
    </div>

    <section class="section hymn-section">
        <div class="section-inner">
            <div class="hymn-card" id="hymn-content">
                <div class="hymn-card-gold-line"></div>
                <p style="text-align:center; color:rgba(15,32,64,0.4); font-size:0.9rem;">Loading…</p>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="shared.js"></script>

    <script>
        function extractYouTubeId(url) {
            if (!url) return null;
            const patterns = [
                /(?:youtube\.com\/watch\?v=)([\w-]+)/,
                /(?:youtu\.be\/)([\w-]+)/,
                /(?:youtube\.com\/embed\/)([\w-]+)/
            ];
            for (const p of patterns) {
                const match = url.match(p);
                if (match) return window.HDICS.dom.safeYouTubeId(match[1], 'hymn video');
            }
            return null;
        }

        fetch('data/hymn.json?v=' + Date.now())
            .then(res => res.json())
            .then(data => {
                const dom = window.HDICS.dom;
                const card = document.getElementById('hymn-content');
                card.textContent = '';

                const children = [dom.el('div', { className: 'hymn-card-gold-line' })];
                children.push(dom.el('h2', { className: 'hymn-title', text: data.title }));
                if (data.composer) {
                    children.push(dom.el('p', { className: 'hymn-credit', text: data.composer }));
                }

                const ytId = extractYouTubeId(data.video_url);
                if (ytId) {
                    const video = dom.el('div', { className: 'hymn-video' });
                    const facade = dom.el('div', { className: 'hymn-video-facade', attrs: { id: 'hymn-video-facade', 'data-yt-id': ytId } });
                    dom.appendChildren(facade, [
                        dom.el('img', { attrs: { src: 'https://img.youtube.com/vi/' + ytId + '/hqdefault.jpg', alt: 'Watch the school hymn video', loading: 'lazy' } }),
                        dom.el('div', { className: 'hymn-video-play' })
                    ]);
                    video.appendChild(facade);
                    children.push(video);
                }

                children.push(dom.el('p', { className: 'hymn-lyrics', text: data.lyrics }));

                if (data.audio_file) {
                    const safeAudio = dom.safeLocalAsset(data.audio_file, 'hymn audio');
                    if (safeAudio) {
                        const audioWrap = dom.el('div', { className: 'hymn-audio' });
                        audioWrap.appendChild(dom.el('audio', { attrs: { controls: '', src: safeAudio } }));
                        children.push(audioWrap);
                    }
                }

                dom.appendChildren(card, children);

                const facade = document.getElementById('hymn-video-facade');
                if (facade) {
                    facade.addEventListener('click', () => {
                        const id = dom.safeYouTubeId(facade.getAttribute('data-yt-id'), 'hymn video embed');
                        if (!id) return;
                        const iframe = dom.el('iframe', { attrs: { src: 'https://www.youtube.com/embed/' + id + '?autoplay=1', title: 'School Hymn Video', allow: 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture', allowfullscreen: '' } });
                        facade.replaceWith(iframe);
                    });
                }
            })
            .catch(err => {
                document.getElementById('hymn-content').innerHTML = '<div class="hymn-card-gold-line"></div><p style="text-align:center; color:rgba(15,32,64,0.4);">Unable to load the school hymn right now.</p>';
                console.error('Hymn data failed to load:', err);
            });
    </script>

</body>
</html>
