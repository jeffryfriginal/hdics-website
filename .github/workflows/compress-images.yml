name: Compress uploaded images

# Runs automatically on every push to main that touches uploads/.
# Only compresses files that actually changed in this push — not the
# whole uploads/ folder — so previously-compressed images don't get
# re-encoded (and re-degraded) on every run.

on:
  push:
    branches: [main]
    paths:
      - 'uploads/**'

permissions:
  contents: write   # required so the auto-generated GITHUB_TOKEN can push the commit back — without this, GitHub gives it read-only access by default and the final push step fails with 403

jobs:
  compress:
    runs-on: ubuntu-latest
    # Prevents infinite loop: don't re-trigger on commits this workflow itself makes
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm install sharp

      - name: Compress and resize changed images
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          cat > compress.js << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');
          const sharp = require('sharp');

          const DIR = 'uploads';
          const DATA_DIR = 'data';
          const MAX_WIDTH = 1600;       // no on-site image needs to be wider than this
          const JPEG_QUALITY = 78;
          const PNG_QUALITY = 80;

          // Tracks oldFilename -> newFilename for any HEIC->JPG renames this run,
          // so we can sweep data/*.json afterward and fix references automatically.
          const renames = [];

          function updateJsonReferences() {
            if (renames.length === 0) return;
            if (!fs.existsSync(DATA_DIR)) return;

            const jsonFiles = fs.readdirSync(DATA_DIR).filter(f => f.endsWith('.json'));

            for (const jsonFile of jsonFiles) {
              const full = path.join(DATA_DIR, jsonFile);
              let text = fs.readFileSync(full, 'utf8');
              let changed = false;

              for (const { oldName, newName } of renames) {
                if (text.includes(oldName)) {
                  text = text.split(oldName).join(newName);
                  changed = true;
                  console.log(`Updated reference in ${jsonFile}: ${oldName} -> ${newName}`);
                }
              }

              if (changed) fs.writeFileSync(full, text);
            }
          }

          function getChangedFiles() {
            const before = process.env.BEFORE_SHA;
            const after = process.env.AFTER_SHA;

            // On a brand new branch, GitHub sets `before` to all zeros —
            // there's no prior commit to diff against, so fall back to
            // just the files touched in the single latest commit.
            const isNewBranch = /^0+$/.test(before || '');
            const range = isNewBranch ? `${after} -1` : `${before} ${after}`;
            const cmd = isNewBranch
              ? `git diff --name-only ${after} -1 -- ${DIR}/`
              : `git diff --name-only ${before} ${after} -- ${DIR}/`;

            const out = execSync(cmd).toString();
            return out
              .split('\n')
              .filter(Boolean)
              .map(f => path.basename(f));
          }

          async function run() {
            const changed = getChangedFiles();

            if (changed.length === 0) {
              console.log('No changed files under uploads/ to process.');
              return;
            }

            console.log(`Processing ${changed.length} changed file(s): ${changed.join(', ')}`);

            for (const file of changed) {
              const ext = path.extname(file).toLowerCase();
              const full = path.join(DIR, file);

              if (!fs.existsSync(full)) {
                // File was deleted or renamed in this push — nothing to compress.
                console.log(`Skipping ${file} (no longer present, likely deleted/renamed)`);
                continue;
              }

              const stat = fs.statSync(full);
              if (!stat.isFile()) continue;

              // Skip already-small files — don't waste time re-encoding
              if (stat.size < 150 * 1024) continue;

              try {
                if (['.jpg', '.jpeg'].includes(ext)) {
                  const buf = await sharp(full)
                    .resize({ width: MAX_WIDTH, withoutEnlargement: true })
                    .jpeg({ quality: JPEG_QUALITY, mozjpeg: true })
                    .toBuffer();
                  if (buf.length < stat.size) fs.writeFileSync(full, buf);
                } else if (ext === '.png') {
                  const buf = await sharp(full)
                    .resize({ width: MAX_WIDTH, withoutEnlargement: true })
                    .png({ quality: PNG_QUALITY, compressionLevel: 9 })
                    .toBuffer();
                  if (buf.length < stat.size) fs.writeFileSync(full, buf);
                } else if (ext === '.heic' || ext === '.heif') {
                  // Browsers can't display HEIC at all — convert to JPEG so it
                  // actually renders on the site instead of silently failing.
                  const jpgPath = full.replace(/\.(heic|heif)$/i, '.jpg');
                  const buf = await sharp(full)
                    .resize({ width: MAX_WIDTH, withoutEnlargement: true })
                    .jpeg({ quality: JPEG_QUALITY, mozjpeg: true })
                    .toBuffer();
                  fs.writeFileSync(jpgPath, buf);
                  fs.unlinkSync(full);
                  renames.push({ oldName: file, newName: path.basename(jpgPath) });
                  console.log(`Converted ${file} -> ${path.basename(jpgPath)}`);
                }
              } catch (e) {
                console.error(`Failed to compress ${file}:`, e.message);
              }
            }

            updateJsonReferences();
          }

          run();
          SCRIPT
          node compress.js

      - name: Commit compressed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uploads/ data/
          git diff --staged --quiet || git commit -m "Auto-compress uploaded images [skip ci]"
          git push
