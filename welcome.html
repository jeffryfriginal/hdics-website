<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to HDICS | HDICS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="shared.css">
    <style>
        .welcome-section { background: var(--cream); }
        .welcome-video {
            max-width: 960px;
            margin: 0 auto;
        }
        .welcome-video-facade {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            background: var(--navy);
            box-shadow: 0 14px 40px rgba(15,32,64,0.12);
        }
        .welcome-video-facade img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .welcome-video-play {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 76px; height: 76px;
            background: rgba(201,146,42,0.92);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }
        .welcome-video-facade:hover .welcome-video-play { background: var(--gold-light); transform: translate(-50%, -50%) scale(1.08); }
        .welcome-video-play::after {
            content: '';
            border-style: solid;
            border-width: 14px 0 14px 22px;
            border-color: transparent transparent transparent var(--navy);
            margin-left: 6px;
        }
        .welcome-video iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 18px;
            border: none;
            display: block;
            box-shadow: 0 14px 40px rgba(15,32,64,0.12);
        }
        .welcome-empty {
            text-align: center;
            color: var(--gray-text);
            font-size: 0.95rem;
            font-weight: 300;
        }
    </style>
</head>
<body data-page="welcome">

    <div id="nav-placeholder">
        <div class="nav-skeleton">
            <div class="nav-skeleton-brand">
                <div class="skel skel-circle" style="width:44px;height:44px;"></div>
                <div>
                    <div class="skel" style="width:160px;height:14px;margin-bottom:6px;"></div>
                    <div class="skel" style="width:210px;height:10px;"></div>
                </div>
            </div>
            <div class="nav-skeleton-links">
                <div class="skel" style="width:50px;height:12px;"></div>
                <div class="skel" style="width:70px;height:12px;"></div>
                <div class="skel" style="width:55px;height:12px;"></div>
                <div class="skel" style="width:80px;height:12px;"></div>
                <div class="skel" style="width:65px;height:12px;"></div>
                <div class="skel" style="width:60px;height:12px;"></div>
                <div class="skel" style="width:100px;height:34px;border-radius:20px;"></div>
            </div>
        </div>
    </div>

    <div class="page-banner">
        <div class="page-banner-inner">
            <p class="page-banner-crumb"><a href="index.html">Home</a> / <a href="about-us.html">About Us</a> / Welcome to HDICS</p>
            <h1>Welcome to HDICS</h1>
        </div>
    </div>

    <section class="section welcome-section">
        <div class="section-inner">
            <div class="welcome-video" id="welcome-video"></div>
        </div>
    </section>

    <div id="footer-placeholder">
        <div class="footer-skeleton">
            <div class="footer-skeleton-inner">
                <div class="footer-skeleton-col">
                    <div class="skel skel-circle" style="width:40px;height:40px;"></div>
                    <div class="skel" style="width:70%;height:14px;"></div>
                    <div class="skel" style="width:50%;height:10px;"></div>
                </div>
                <div class="footer-skeleton-col">
                    <div class="skel" style="width:40%;height:12px;margin-bottom:0.4rem;"></div>
                    <div class="skel" style="width:60%;height:10px;"></div>
                    <div class="skel" style="width:55%;height:10px;"></div>
                    <div class="skel" style="width:65%;height:10px;"></div>
                    <div class="skel" style="width:50%;height:10px;"></div>
                </div>
                <div class="footer-skeleton-col">
                    <div class="skel" style="width:40%;height:12px;margin-bottom:0.4rem;"></div>
                    <div class="skel" style="width:80%;height:10px;"></div>
                    <div class="skel" style="width:70%;height:10px;"></div>
                    <div class="skel" style="width:60%;height:10px;"></div>
                </div>
            </div>
            <div class="footer-skeleton-accred">
                <div class="skel" style="width:100px;height:60px;"></div>
                <div class="skel" style="width:120px;height:60px;"></div>

    <script src="shared.js"></script>

    <script>
        (function () {
            // Paste the full YouTube link here (watch?v=..., youtu.be/..., or embed/...).
            var WELCOME_VIDEO_URL = 'https://youtu.be/3h6Uw_d1dGA';

            var dom = window.HDICS.dom;
            var container = document.getElementById('welcome-video');

            function extractYouTubeId(url) {
                if (!url) return null;
                var patterns = [
                    /(?:youtube\.com\/watch\?v=)([\w-]+)/,
                    /(?:youtu\.be\/)([\w-]+)/,
                    /(?:youtube\.com\/embed\/)([\w-]+)/
                ];
                for (var i = 0; i < patterns.length; i++) {
                    var match = url.match(patterns[i]);
                    if (match) return dom.safeYouTubeId(match[1], 'welcome video');
                }
                return null;
            }

            var ytId = extractYouTubeId(WELCOME_VIDEO_URL);
            if (!ytId) {
                container.appendChild(dom.el('p', { className: 'welcome-empty', text: 'Our welcome video is coming soon.' }));
                return;
            }

            // Thumbnail first, real iframe only on click, so YouTube isn't loaded until wanted.
            var facade = dom.el('div', { className: 'welcome-video-facade', attrs: { role: 'button', tabindex: '0', 'aria-label': 'Play the Welcome to HDICS video' } });
            dom.appendChildren(facade, [
                dom.el('img', { attrs: { src: 'https://img.youtube.com/vi/' + ytId + '/hqdefault.jpg', alt: 'Welcome to HDICS video', loading: 'lazy' } }),
                dom.el('div', { className: 'welcome-video-play' })
            ]);
            container.appendChild(facade);

            function loadVideo() {
                var iframe = dom.el('iframe', { attrs: {
                    src: 'https://www.youtube.com/embed/' + ytId + '?autoplay=1',
                    title: 'Welcome to HDICS',
                    allow: 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture',
                    allowfullscreen: ''
                } });
                facade.replaceWith(iframe);
            }
            facade.addEventListener('click', loadVideo);
            facade.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); loadVideo(); }
            });
        })();
    </script>

</body>
</html>
