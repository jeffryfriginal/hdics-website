<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | HDICS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="shared.css">
    <style>
        .gallery-section { background: var(--cream); }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }
        .carousel-block { display: flex; flex-direction: column; }
        .carousel-block-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 0.9rem;
        }

        .carousel {
            position: relative;
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: var(--navy);
            box-shadow: 0 14px 40px rgba(15,32,64,0.12);
        }
        .carousel-track-wrap {
            overflow: hidden;
            width: 100%;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.4s ease;
        }
        .carousel-slide {
            flex: 0 0 100%;
            aspect-ratio: 4 / 3;
            background-size: cover;
            background-position: center;
            cursor: zoom-in;
        }

        @media (max-width: 768px) {
            .gallery-grid { grid-template-columns: 1fr; }
        }

        /* LIGHTBOX */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(8,15,29,0.94);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }
        .lightbox.open { display: flex; }
        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .lightbox-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1.5px solid rgba(255,255,255,0.3);
            color: var(--white);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .lightbox-close:hover { background: var(--gold); border-color: var(--gold); color: var(--navy); }
        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1.5px solid rgba(255,255,255,0.3);
            color: var(--white);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 5;
            user-select: none;
        }
        .lightbox-arrow:hover { background: var(--gold); border-color: var(--gold); color: var(--navy); }
        .lightbox-arrow.prev { left: 1.5rem; }
        .lightbox-arrow.next { right: 1.5rem; }
        .lightbox-counter {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.1);
            border: 1.5px solid rgba(255,255,255,0.3);
            color: var(--white);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            padding: 0.4rem 1rem;
            border-radius: 100px;
            z-index: 5;
        }
        @media (max-width: 600px) {
            .lightbox { padding: 4.5rem 1rem 1.5rem; }
            .lightbox-close { top: 1rem; right: 1rem; width: 38px; height: 38px; font-size: 1.2rem; }
            .lightbox-arrow { width: 42px; height: 42px; font-size: 1.2rem; }
            .lightbox-arrow.prev { left: 0.6rem; }
            .lightbox-arrow.next { right: 0.6rem; }
            .lightbox-counter { bottom: 0.75rem; font-size: 0.78rem; }
        }
    </style>
</head>
<body data-page="gallery">

    <div id="nav-placeholder">
        <div class="nav-skeleton">
            <div class="nav-skeleton-brand">
                <div class="skel skel-circle" style="width:44px;height:44px;"></div>
                <div>
                    <div class="skel" style="width:160px;height:14px;margin-bottom:6px;"></div>
                    <div class="skel" style="width:210px;height:10px;"></div>
                </div>
            </div>
            <div class="nav-skeleton-links">
                <div class="skel" style="width:50px;height:12px;"></div>
                <div class="skel" style="width:70px;height:12px;"></div>
                <div class="skel" style="width:55px;height:12px;"></div>
                <div class="skel" style="width:80px;height:12px;"></div>
                <div class="skel" style="width:65px;height:12px;"></div>
                <div class="skel" style="width:60px;height:12px;"></div>
                <div class="skel" style="width:100px;height:34px;border-radius:20px;"></div>
            </div>
        </div>
    </div>

    <div class="page-banner">
        <div class="page-banner-inner">
            <p class="page-banner-crumb"><a href="index.html">Home</a> / Gallery</p>
            <h1>Gallery</h1>
            <p>Moments from campus life at HDICS.</p>
        </div>
    </div>

    <section class="section gallery-section">
        <div class="section-inner">
            <p class="section-label" style="text-align:center;">Photo Gallery</p>
            <h2 class="section-title" style="text-align:center; margin-bottom:2.5rem;">Life at HDICS</h2>

            <div class="gallery-grid" id="gallery-grid">
                <p style="color:rgba(15,32,64,0.4); font-size:0.9rem;">Loading gallery…</p>
            </div>
        </div>
    </section>


    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
        <button class="lightbox-arrow prev" id="lightbox-prev" aria-label="Previous photo">&#8249;</button>
        <img id="lightbox-img" src="" alt="">
        <button class="lightbox-arrow next" id="lightbox-next" aria-label="Next photo">&#8250;</button>
        <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>

    <div id="footer-placeholder">
        <div class="footer-skeleton">
            <div class="footer-skeleton-inner">
                <div class="footer-skeleton-col">
                    <div class="skel skel-circle" style="width:40px;height:40px;"></div>
                    <div class="skel" style="width:70%;height:14px;"></div>
                    <div class="skel" style="width:50%;height:10px;"></div>
                </div>
                <div class="footer-skeleton-col">
                    <div class="skel" style="width:40%;height:12px;margin-bottom:0.4rem;"></div>
                    <div class="skel" style="width:60%;height:10px;"></div>
                    <div class="skel" style="width:55%;height:10px;"></div>
                    <div class="skel" style="width:65%;height:10px;"></div>
                    <div class="skel" style="width:50%;height:10px;"></div>
                </div>
                <div class="footer-skeleton-col">
                    <div class="skel" style="width:40%;height:12px;margin-bottom:0.4rem;"></div>
                    <div class="skel" style="width:80%;height:10px;"></div>
                    <div class="skel" style="width:70%;height:10px;"></div>
                    <div class="skel" style="width:60%;height:10px;"></div>
                </div>
            </div>
            <div class="footer-skeleton-accred">
                <div class="skel" style="width:100px;height:60px;"></div>
                <div class="skel" style="width:120px;height:60px;"></div>
                <div class="skel" style="width:90px;height:60px;"></div>
            </div>
            <div class="footer-skeleton-bottom">
                <div class="skel" style="width:280px;height:12px;"></div>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>

    <script>
        (function () {
            const dom = window.HDICS.dom;

            function buildCarouselBlock(carousel, carouselIdx) {
                const title = typeof carousel.title === 'string' && carousel.title.trim() ? carousel.title : 'Untitled Gallery';
                if (!Array.isArray(carousel.images) || carousel.images.length === 0) {
                    console.warn('[HDICS] Skipping gallery carousel with no images:', title);
                    return null;
                }

                const block = dom.el('div', { className: 'carousel-block' });
                const carouselEl = dom.el('div', { className: 'carousel', attrs: { 'data-carousel': '' } });
                const trackWrap = dom.el('div', { className: 'carousel-track-wrap' });
                const track = dom.el('div', { className: 'carousel-track' });

                dom.renderList(track, carousel.images, (img, slideIdx) => {
                    const safeImage = dom.safeLocalAsset(img, 'gallery image');
                    if (!safeImage) return null;
                    const slide = dom.el('div', { className: 'carousel-slide', attrs: { 'data-carousel-idx': carouselIdx, 'data-slide-idx': slideIdx } });
                    slide.style.backgroundImage = `url('${safeImage}')`;
                    return slide;
                });

                dom.appendChildren(trackWrap, [track]);
                dom.appendChildren(carouselEl, [trackWrap]);
                return dom.appendChildren(block, [
                    dom.el('h3', { className: 'carousel-block-title', text: title }),
                    carouselEl
                ]);
            }

            fetch('data/gallery.json?v=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('gallery-grid');
                    const validCarousels = (Array.isArray(data.carousels) ? data.carousels : []).filter(carousel => {
                        const title = carousel && typeof carousel.title === 'string' && carousel.title.trim() ? carousel.title : 'Untitled Gallery';
                        if (!carousel || !Array.isArray(carousel.images) || carousel.images.length === 0) {
                            console.warn('[HDICS] Skipping gallery carousel with no images:', title);
                            return false;
                        }
                        return true;
                    });
                    dom.renderList(grid, validCarousels, buildCarouselBlock);
                    setupLightbox(validCarousels);
                })
                .catch(err => {
                    document.getElementById('gallery-grid').innerHTML = '<p style="color:rgba(15,32,64,0.4);">Unable to load gallery right now.</p>';
                    console.error('Gallery data failed to load:', err);
                });

            function setupLightbox(carousels) {
                const lightbox = document.getElementById('lightbox');
                const lightboxImg = document.getElementById('lightbox-img');
                const closeBtn = document.getElementById('lightbox-close');
                const prevBtn = document.getElementById('lightbox-prev');
                const nextBtn = document.getElementById('lightbox-next');
                const counterEl = document.getElementById('lightbox-counter');

                let currentCarouselIdx = 0;
                let currentSlideIdx = 0;

                function showImage(carouselIdx, slideIdx) {
                    const carousel = carousels[carouselIdx];
                    const images = carousel && Array.isArray(carousel.images) ? carousel.images : [];
                    if (images.length === 0) return;
                    slideIdx = (slideIdx + images.length) % images.length;
                    const safeImage = dom.safeLocalAsset(images[slideIdx], 'gallery lightbox image');
                    if (!safeImage) return;
                    currentCarouselIdx = carouselIdx;
                    currentSlideIdx = slideIdx;
                    lightboxImg.src = safeImage;
                    counterEl.textContent = (slideIdx + 1) + ' / ' + images.length;
                }

                function openLightbox(carouselIdx, slideIdx) {
                    showImage(carouselIdx, slideIdx);
                    lightbox.classList.add('open');
                    document.body.style.overflow = 'hidden';
                }

                function closeLightbox() {
                    lightbox.classList.remove('open');
                    document.body.style.overflow = '';
                }

                document.querySelectorAll('.carousel-slide').forEach(slide => {
                    slide.addEventListener('click', () => {
                        openLightbox(
                            parseInt(slide.getAttribute('data-carousel-idx'), 10),
                            parseInt(slide.getAttribute('data-slide-idx'), 10)
                        );
                    });
                });

                closeBtn.addEventListener('click', closeLightbox);
                prevBtn.addEventListener('click', () => showImage(currentCarouselIdx, currentSlideIdx - 1));
                nextBtn.addEventListener('click', () => showImage(currentCarouselIdx, currentSlideIdx + 1));

                // Click on the dark backdrop (not the image or buttons) closes it
                lightbox.addEventListener('click', (e) => {
                    if (e.target === lightbox) closeLightbox();
                });

                document.addEventListener('keydown', (e) => {
                    if (!lightbox.classList.contains('open')) return;
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') showImage(currentCarouselIdx, currentSlideIdx - 1);
                    if (e.key === 'ArrowRight') showImage(currentCarouselIdx, currentSlideIdx + 1);
                });
            }
        })();
    </script>

</body>
</html>
