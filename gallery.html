<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | HDICS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="shared.css">
    <style>
        .gallery-section { background: var(--cream); }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }
        .carousel-block { display: flex; flex-direction: column; }
        .carousel-block-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 0.9rem;
        }

        .carousel {
            position: relative;
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: var(--navy);
            box-shadow: 0 14px 40px rgba(15,32,64,0.12);
        }
        .carousel-track-wrap {
            overflow: hidden;
            width: 100%;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.4s ease;
        }
        .carousel-slide {
            flex: 0 0 100%;
            aspect-ratio: 4 / 3;
            background-size: cover;
            background-position: center;
            cursor: zoom-in;
        }
        .carousel-counter {
            position: absolute;
            bottom: 0.9rem;
            right: 0.9rem;
            background: rgba(15,32,64,0.65);
            color: var(--white);
            font-size: 0.74rem;
            font-weight: 600;
            padding: 0.25rem 0.65rem;
            border-radius: 100px;
            z-index: 2;
            letter-spacing: 0.03em;
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .carousel-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--cream-dark);
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            border: none;
            padding: 0;
        }
        .carousel-dot.active { background: var(--gold); transform: scale(1.25); }
        .carousel-dot:hover { background: var(--gold-light); }

        @media (max-width: 768px) {
            .gallery-grid { grid-template-columns: 1fr; }
        }

        /* LIGHTBOX */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(8,15,29,0.94);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }
        .lightbox.open { display: flex; }
        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .lightbox-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1.5px solid rgba(255,255,255,0.3);
            color: var(--white);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .lightbox-close:hover { background: var(--gold); border-color: var(--gold); color: var(--navy); }
        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1.5px solid rgba(255,255,255,0.3);
            color: var(--white);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 5;
            user-select: none;
        }
        .lightbox-arrow:hover { background: var(--gold); border-color: var(--gold); color: var(--navy); }
        .lightbox-arrow.prev { left: 1.5rem; }
        .lightbox-arrow.next { right: 1.5rem; }
        @media (max-width: 600px) {
            .lightbox { padding: 4.5rem 1rem 1.5rem; }
            .lightbox-close { top: 1rem; right: 1rem; width: 38px; height: 38px; font-size: 1.2rem; }
            .lightbox-arrow { width: 42px; height: 42px; font-size: 1.2rem; }
            .lightbox-arrow.prev { left: 0.6rem; }
            .lightbox-arrow.next { right: 0.6rem; }
        }
    </style>
</head>
<body data-page="gallery">

    <div id="nav-placeholder"></div>

    <div class="page-banner">
        <div class="page-banner-inner">
            <p class="page-banner-crumb"><a href="index.html">Home</a> / Gallery</p>
            <h1>Gallery</h1>
            <p>Moments from campus life at HDICS.</p>
        </div>
    </div>

    <section class="section gallery-section">
        <div class="section-inner">
            <p class="section-label" style="text-align:center;">Photo Gallery</p>
            <h2 class="section-title" style="text-align:center; margin-bottom:2.5rem;">Life at HDICS</h2>

            <div class="gallery-grid" id="gallery-grid">
                <p style="color:rgba(15,32,64,0.4); font-size:0.9rem;">Loading gallery…</p>
            </div>
        </div>
    </section>


    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
        <button class="lightbox-arrow prev" id="lightbox-prev" aria-label="Previous photo">&#8249;</button>
        <img id="lightbox-img" src="" alt="">
        <button class="lightbox-arrow next" id="lightbox-next" aria-label="Next photo">&#8250;</button>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        (function () {
            function initCarousel(block) {
                const track = block.querySelector('.carousel-track');
                const slides = track.children;
                const total = slides.length;
                const counter = block.querySelector('.carousel-counter');
                const dotsWrap = block.parentElement.querySelector('.carousel-dots');
                let index = 0;

                for (let i = 0; i < total; i++) {
                    const dot = document.createElement('button');
                    dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
                    dot.setAttribute('aria-label', 'Go to photo ' + (i + 1));
                    dot.addEventListener('click', () => goTo(i));
                    dotsWrap.appendChild(dot);
                }
                const dots = dotsWrap.children;

                function render() {
                    track.style.transform = 'translateX(-' + (index * 100) + '%)';
                    counter.textContent = (index + 1) + ' / ' + total;
                    for (let i = 0; i < dots.length; i++) {
                        dots[i].classList.toggle('active', i === index);
                    }
                }

                function goTo(i) {
                    index = (i + total) % total;
                    render();
                }

                render();
            }

            function buildCarouselBlock(carousel, carouselIdx) {
                const slidesHtml = carousel.images.map((img, slideIdx) =>
                    `<div class="carousel-slide" style="background-image:url('${img}');" data-carousel-idx="${carouselIdx}" data-slide-idx="${slideIdx}"></div>`
                ).join('');

                return `
                    <div class="carousel-block">
                        <h3 class="carousel-block-title">${carousel.title}</h3>
                        <div class="carousel" data-carousel>
                            <div class="carousel-track-wrap">
                                <div class="carousel-track">${slidesHtml}</div>
                            </div>
                            <div class="carousel-counter"></div>
                        </div>
                        <div class="carousel-dots"></div>
                    </div>
                `;
            }

            fetch('data/gallery.json?v=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('gallery-grid');
                    grid.innerHTML = data.carousels.map(buildCarouselBlock).join('');
                    document.querySelectorAll('[data-carousel]').forEach(initCarousel);
                    setupLightbox(data.carousels);
                })
                .catch(err => {
                    document.getElementById('gallery-grid').innerHTML = '<p style="color:rgba(15,32,64,0.4);">Unable to load gallery right now.</p>';
                    console.error('Gallery data failed to load:', err);
                });

            function setupLightbox(carousels) {
                const lightbox = document.getElementById('lightbox');
                const lightboxImg = document.getElementById('lightbox-img');
                const closeBtn = document.getElementById('lightbox-close');
                const prevBtn = document.getElementById('lightbox-prev');
                const nextBtn = document.getElementById('lightbox-next');

                let currentCarouselIdx = 0;
                let currentSlideIdx = 0;

                function showImage(carouselIdx, slideIdx) {
                    const images = carousels[carouselIdx].images;
                    slideIdx = (slideIdx + images.length) % images.length;
                    currentCarouselIdx = carouselIdx;
                    currentSlideIdx = slideIdx;
                    lightboxImg.src = images[slideIdx];
                }

                function openLightbox(carouselIdx, slideIdx) {
                    showImage(carouselIdx, slideIdx);
                    lightbox.classList.add('open');
                    document.body.style.overflow = 'hidden';
                }

                function closeLightbox() {
                    lightbox.classList.remove('open');
                    document.body.style.overflow = '';
                }

                document.querySelectorAll('.carousel-slide').forEach(slide => {
                    slide.addEventListener('click', () => {
                        openLightbox(
                            parseInt(slide.getAttribute('data-carousel-idx'), 10),
                            parseInt(slide.getAttribute('data-slide-idx'), 10)
                        );
                    });
                });

                closeBtn.addEventListener('click', closeLightbox);
                prevBtn.addEventListener('click', () => showImage(currentCarouselIdx, currentSlideIdx - 1));
                nextBtn.addEventListener('click', () => showImage(currentCarouselIdx, currentSlideIdx + 1));

                // Click on the dark backdrop (not the image or buttons) closes it
                lightbox.addEventListener('click', (e) => {
                    if (e.target === lightbox) closeLightbox();
                });

                document.addEventListener('keydown', (e) => {
                    if (!lightbox.classList.contains('open')) return;
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') showImage(currentCarouselIdx, currentSlideIdx - 1);
                    if (e.key === 'ArrowRight') showImage(currentCarouselIdx, currentSlideIdx + 1);
                });
            }
        })();
    </script>

    <script src="shared.js"></script>

</body>
</html>
